<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bricadeira de familia</title>
     <link rel="stylesheet" href="estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconneect" href="http://font.gstatic.com"crossorigin>
    <link href="https//fonts.googleapis.com/css2?family=roboto:wght@400;700display=swap"rel='stylesheet'>
</head>
<body>
    <header> desenvolvido por <a href="https://www.instagram.com/bruninho.cawboy">bruno</a></header>
  <img src="image.png" id="imagem-fundo">
  
 <button id="logoutBtn">Sair</button>

    <div class="envoltorio-conteudo">
        <div id="container-inicio" class="container">
            <h1>TESTE SEU CONHECIMENTO</h1>
            <p>Digite seu nome para começar </p> <!--aqui não é pra colocar o seu nome, é só a frase que irá aparecer-->
            <input type="text" id="entrada-nome" placeholder="Seu nome aqui">
            <p id="mensagem-erro" class="texto-erro oculto"></p>
            <button id="btn-comecar">Começar o Quiz</button>
        </div>

        <div id="quiz-principal" class="container-quiz container oculto">
            <div class="container-progresso">
                <div id="barra-progresso" class="barra-progresso" style="width: 0%"></div>
            </div>
            
            <div id="quiz">
                <h2 id="pergunta"></h2>
                <div id="opcoes"></div>
                
                <div id="mensagem-feedback"></div>

                <div class="botoes-navegacao">
                    <button id="botao-voltar" onclick="perguntaAnterior()">Voltar</button>
                    <button id="botao-proximo" onclick="verificarResposta()">Verificar</button>
                </div>
            </div>
            <div id="resultado" class="oculto">
                <div id="mensagem"></div>
                
                <div class="estatisticas-resultado">
                    <div class="caixa-estatistica">
                        <h3>Acertos</h3>
                        <div id="contador-acertos" class="valor-estatistica estatistica-correta">0</div>
                        <p>Parabéns, farmou aura</p>
                    </div>
                    <div class="caixa-estatistica">
                        <h3>Erros</h3>
                        <div id="contador-erros" class="valor-estatistica estatistica-incorreta">0</div>
                        <p>Continue faramando aura</p>
                    </div>
                </div>
                
                <button id="botao-reiniciar" onclick="reiniciarQuiz()">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <audio id="som-acertou" src="applepay.mp3"></audio>
    <audio id="som-errou" src="rizz-sound-effect.mp3"></audio>
    <audio id="som-sucesso" src="piao-do-bau-com-musica.mp3"></audio>
    <audio id="som-derrota" src="rizz-sound-effect.mp3"></audio>

<script type="module" src="script.js"></script>

</body>
</html>
